BaseConfig: reachability_gp_isaaclab22.yaml

Wandb:
  Name: "FDPI-reachability-gp-IsaacLab22-SurgicalRobot5-wm-safety50"

FDPIRegimeDreamer:
  WorldModelSampling:
    EnableSafetyCriticalSampling: true
    UniformRatio: 0.50
    SafetyCriticalRatio: 0.50
    HighCostThreshold: 0.1
    BoundaryLow: 0.05
    BoundaryHigh: 0.4

  Performance:
    AllowTF32: true
    MatmulPrecision: "high"
    CudnnBenchmark: false
    LogEverySteps: 1024
    DetailedLogEverySteps: 2048
    TimingLogEverySteps: 8192
    CacheReplayStarts: true
