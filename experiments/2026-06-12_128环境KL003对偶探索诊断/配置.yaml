实验:
  名称: "128环境KL003对偶探索诊断"
  日期: "2026-06-12"
  目的: "在不改变 dual 训练目标和 128 env 训练密度的前提下，将 DualUpdate.KLCoeff 从 0.1 降到 0.03，验证 KL 项减弱后 dual 是否更倾向采集真实危险样本。"
  输出目录: "experiments/2026-06-12_128环境KL003对偶探索诊断"

运行:
  tmux_session: "dual_kl003_128env_long"
  seed: 0
  device: "cuda:0"
  env_name: "SurgicalRobot5-HeadPipe-GraspGoalDreamerForce-OSC-RL-Direct-v1"
  num_envs: 128

训练:
  total_env_steps: 10000000
  buffer_warmup_env_steps: 51200
  batch_size: 128
  batch_length: 64
  imagine_batch_size: 128
  imagine_context: 16
  imagine_horizon: 15
  train_model_every_steps: 256
  train_agent_every_steps: 256
  model_update: 4
  agent_update: 4
  gp_update_steps: 2
  gd_start_step: 1000000
  gd_update_steps: 2
  dual_sampling_start_step: 1000000
  dual_update_start_step: 1000000
  dual_update_type: "imagined_risk_return"
  dual_update_steps: 2
  dual_kl_coeff: 0.03

世界模型评估:
  enable: true
  start_step: 1000000
  every_steps: 1000000
  eval_length: 48
  context_length: 16
  horizons: [1, 3, 5, 10, 15, 30]
  说明: "源码配置已开启低频 WMEval；已启动的旧 run 不会自动包含该指标，重启后生效。"

工程优化:
  amp: true
  tf32: true
  replay_start_cache: true
  sample_many: true
  batched_critic_latent_encoding: true
  timing_log_every_steps: 0
  log_every_steps: 8192

日志:
  wandb_mode: "online"
  run_name: "fdpi-baseline-engineering-dual-kl003-128env"
  checkpoint_dir: "experiments/2026-06-12_128环境KL003对偶探索诊断/检查点"
  log_dir: "experiments/2026-06-12_128环境KL003对偶探索诊断/日志"
